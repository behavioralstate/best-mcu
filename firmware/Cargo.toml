[package]
name = "best-mcu"
description = "The firmware: the door served over HTTPS from an ESP32-S3"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/behavioralstate/best-mcu"

[[bin]]
name = "best-mcu"
harness = false

[features]
# The emulated Ethernet of Espressif's QEMU, in place of the board's Wi-Fi.
qemu = []

[dependencies]
best-mcu-door = { path = "../crates/door" }
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

# The camera's driver, in the component registry. Its bindings are esp_idf_svc::sys::camera.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "2.1.8" }
bindings_header = "src/bindings.h"
bindings_module = "camera"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
