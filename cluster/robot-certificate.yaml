# The board's certificate, issued and renewed by the cluster's cert-manager through its letsencrypt-prod issuer over
# HTTP-01: robot.behavioralstate.io is a CNAME to the cluster's load balancer while it is issued or renewed. ECDSA
# P-256 keeps the board's handshakes cheap; a new key at each renewal, so the board is flashed again with it
# (scripts/cluster-cert.sh).
#
#   kubectl apply -f cluster/robot-certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: robot-tls
  namespace: behavioralstateprotocol
spec:
  secretName: robot-tls
  dnsNames:
    - robot.behavioralstate.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
